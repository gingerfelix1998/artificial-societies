# The persona registry: the population this project claims to model.
#
# The group being modelled is the authors of the nuclear-strategy literature. These are
# the 100 personas in the claim (15 here in phase 1); President, Advisor and Intelligence
# Officer are instruments that aggregate and act on their opinions, not members of the
# population.
#
# TWO FIELDS HERE ARE PLACEHOLDERS AND MUST NOT BE DESCRIBED OTHERWISE:
#
#   corpus_notes  One-line paraphrases written so the loop runs under StubRetriever. They
#                 are not evidence, they are not quotations, and no claim of grounding may
#                 rest on them. They are replaced by real per-theorist corpus retrieval.
#
#   prominence    INVENTED NUMBERS. They are not citation counts and are not calibrated
#                 against anything. Routing does not weight by them today; before any
#                 weighted routing is switched on they must be set from a real citation
#                 source, or the weighting silently encodes a guess.
#
# `tags` must be drawn from schema.TAG_VOCAB. An off-vocabulary tag matches no question
# and leaves the persona reachable only by routing top-up, so personas.load_registry
# rejects one at load rather than letting it fail silently at route time.
#
# `era` is host-side metadata for later period comparison (phase 3). It is not routed on.
#
# `corpus_source` names which pipeline builds this persona's store: `wikipedia` fetches and
# chunks the page below, `markdown` reads committed documents from
# data/corpora-src/<persona_id>/ and builds a claim index from them. It is DECLARED HERE
# AND NEVER INFERRED. Inferring it from whether a source directory happens to exist is a
# silent fallback under another name: a persona whose documents had not been added yet
# would quietly be built from an encyclopedia article and reported as grounded. Declared
# `markdown` with no documents raises instead (invariant 4), and the retriever refuses to
# serve a store whose manifest says it was built from something other than what is declared
# here (invariant 9).
#
# ALL TWELVE PERSONAS ARE NOW `markdown`. Wikipedia has been retired as a source of record:
# it is a TERTIARY source (an encyclopedia article *about* the theorist, not their writing)
# and it cannot support the held-out-writings check the approach doc claims as this
# population's advantage. The three fields below — `wikipedia`, `semantic_scholar`,
# `key_works` — are no longer read by ingest. They are kept for provenance and so a persona
# could be moved back to the `wikipedia` pipeline without re-deriving them; the `wikipedia`
# ingest code and its tests remain in place unchanged.
#
# `wikipedia` was the page title `artsoc ingest` fetched. Retained, unused.
#
# `semantic_scholar` was a VERIFIED author id, or null — checked against that author's
# actual top-cited papers, not a name search. Two are deliberately null: "Bernard Brodie"
# resolves to the pharmacologist (acetaminophen hepatic necrosis, h=84) and "Lawrence
# Freedman" to a merged author whose top works are by P.W. Singer and James Mann. Retained,
# unused.
#
# `key_works` were the titles abstracts were looked up by. Retained, unused.
#
# Three personas were removed when the pages were checked: Caitlin Talmadge and
# Keir Lieber / Daryl Press have no article, and Vipin Narang's is about 150 words. They
# belong back in the registry the moment a primary-text corpus exists.

schema_version: "1.0.0"

personas:
  - persona_id: brodie
    name: Bernard Brodie
    era: early_deterrence
    corpus_source: markdown
    wikipedia: 'Bernard Brodie (military strategist)'
    semantic_scholar: null
    key_works:
      - 'The Absolute Weapon: Atomic Power and World Order'
      - 'Strategy in the Missile Age'
      - 'War and Politics'
    prominence: 0.85 # INVENTED
    tags: [deterrence, doctrine, credibility, escalation]
    corpus_notes: >-
      PLACEHOLDER paraphrase. Argued that the arrival of the atomic bomb shifted the
      purpose of a military establishment from winning wars to averting them.

