[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artsoc"
version = "0.1.0"
description = "Phase 1: LLM persona panel simulating nuclear escalation decisions under Monte Carlo"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

# The provider SDK is OPTIONAL, not a core dependency. `make install` and `make test` must
# keep working on a machine with no provider SDK and no network — that is the offline
# guarantee ADR 0002 kept when it retired "there is no live backend". A live run installs
# the extra explicitly with `make install-live`.
[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]
live = [
    "anthropic>=1",
]
# The local frontend's read-only API. Optional for the same reason `live` is: `make
# install` and `make test` must keep working with neither installed. Nothing in `artsoc`
# imports `artsoc.api`, so the core package does not acquire a web framework, and a test
# asserts that stays true.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
artsoc = "artsoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Import artsoc from the source tree directly rather than relying on the editable
# install's .pth file, which macOS iCloud Drive can render invisible to CPython.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
