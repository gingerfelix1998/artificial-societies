[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artsoc"
version = "0.1.0"
description = "Phase 1: LLM persona panel simulating nuclear escalation decisions under Monte Carlo"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

# No model-provider SDK is listed on purpose. Phase 1 runs entirely offline against the
# mock backend in artsoc.llm; a live backend is a later task and would add a dependency.
[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[project.scripts]
artsoc = "artsoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Import artsoc from the source tree directly rather than relying on the editable
# install's .pth file, which macOS iCloud Drive can render invisible to CPython.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
