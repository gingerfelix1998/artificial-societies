# Defaults inherited by every arm. An arm file overlays this and should differ in as few
# fields as possible: the point of an arm is to vary one thing so the contrast is
# attributable to that thing.
#
# Nothing here is a CLI flag. Only --n, --seed0, --out-dir and --append are operational
# enough to live on the command line (CLAUDE.md invariant 5); everything below changes
# what is being tested and is therefore recorded in every output record.

scenario_id: phase1_tel_dispersal_v1

# LIVE. Every `artsoc run` now makes real API calls and costs real money.
#
# Set back to `mock` to return to free offline runs. The test suite is unaffected either
# way: tests/conftest.py refuses to construct a live backend, so `make test` stays offline
# regardless of what this says.
backend: anthropic

# Model per role, used only by a live backend. Assignment follows measured cost share:
#
#   president_decision  ~45% of billable input tokens. Never cached, because caching the
#                       decision would collapse the Monte Carlo distribution to a point
#                       mass — and it IS the primary metric. Do not economise here.
#   theorist            ~38% of calls but caches down to ~22% of tokens. The largest
#                       single saving available, at the cost of persona fidelity.
#   advisor_selection   ~18% of input. A routing judgement with short output.
#   advisor_synthesis   ~10%. A modelled compression whose losses are a finding.
#   upstream roles      under 4% combined, because only a handful of distinct perceived
#                       views exist and they cache almost completely. Effectively free,
#                       so they get the strongest model.
models:
  intelligence_officer: claude-opus-5
  president_query: claude-opus-5
  advisor_questions: claude-opus-5
  advisor_selection: claude-sonnet-5
  theorist: claude-haiku-4-5
  advisor_synthesis: claude-sonnet-5
  president_decision: claude-opus-5

# Thinking depth for models that take adaptive thinking. Thinking tokens bill as output,
# and output already dominates this workload, so this is the main cost dial.
effort: medium

# ==========================================================================
# TEMPORARY — REMOVE BEFORE COLLECTING ANY RESULTS
# ==========================================================================
# Forces every role onto one cheap model so the first live runs check the wiring
# without paying Opus rates: that credentials resolve, that every role returns
# parseable JSON, that the out-of-record hatch fires, that a record round-trips.
#
# This supersedes `models` above, including president_decision. That call is the
# primary metric, so a run under this override measures something different from
# a run without it — it is not a cheaper version of the same experiment.
#
# `artsoc run` prints a warning before starting, and `artsoc analyse` marks any
# report containing such a run as SMOKE TEST, NOT A RESULT. Delete this line to
# restore the per-role assignment above.
models_override: claude-haiku-4-5

# An experimental choice, not an optimisation. On: measured variance is variance in the
# decision step given fixed advisory input. Off: whole-system variance.
cache_enabled: true

# StubRetriever returns registry paraphrases and reports grounded=false. No run under it
# may be described as corpus-grounded.
retrieval_mode: stub

# The full loop: intelligence brief, presidential query, panel, advisory brief, decision.
consult_panel: true

persona_method: m2
panel_source: registry
panel_size: 15

k_per_question: 4
n_questions: 3

synthesis_mode: full_range
